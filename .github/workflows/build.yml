name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: make ARCH="arm64 x86_64"

      - name: Make DMG
        run: |
          mkdir -p dmg
          cp -R "build/Open With.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Open With" -srcfolder dmg -ov -format UDZO OpenWith.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWith
          path: OpenWith.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenWith.dmg
